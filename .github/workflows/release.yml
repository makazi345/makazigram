name: Build Makazigram
on:
  push:
    branches: [ "rewrite" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' # Отключает установку удаленного пакета 'tools'

      - name: Create API_KEYS
        run: |
          # Вставляем твои данные
          echo "APP_ID=38743864" > API_KEYS
          echo "APP_HASH=d5830ede00e788b2604639238e6855ed" >> API_KEYS

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makazigram-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
